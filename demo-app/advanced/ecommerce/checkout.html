<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><title>Checkout</title><style>body{font:16px system-ui;margin:40px;max-width:480px}label,input,button{display:block;width:100%;box-sizing:border-box;margin:8px 0}input,button{padding:8px}.success{color:#087f23}.error{color:#b42318}</style></head>
<body><h1>Checkout</h1><p id="checkout-total"></p><form id="checkout-form"><label for="customer-name">Name</label><input id="customer-name" required><label for="shipping-address">Shipping address</label><input id="shipping-address" required><button id="place-order" type="submit">Place order</button></form><p id="checkout-error" class="error"></p><p id="order-result" class="success" aria-live="polite"></p>
<script>
const items=JSON.parse(localStorage.getItem("demo-cart")||"[]");document.querySelector("#checkout-total").textContent="Order total: $"+items.reduce((n,x)=>n+x.price,0).toFixed(2);document.querySelector("#checkout-form").onsubmit=e=>{e.preventDefault();const customerName=document.querySelector("#customer-name").value,address=document.querySelector("#shipping-address").value;if(!items.length){document.querySelector("#checkout-error").textContent="Add an item before checkout";return}if(!customerName||!address){document.querySelector("#checkout-error").textContent="Name and address are required";return}localStorage.removeItem("demo-cart");document.querySelector("#order-result").textContent="Order placed for "+customerName};
</script></body></html>
