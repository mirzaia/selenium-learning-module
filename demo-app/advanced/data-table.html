<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><title>Data Table</title><style>body{font:16px system-ui;margin:40px}table{border-collapse:collapse;width:720px}th,td{padding:9px;border:1px solid #ccd6e0;text-align:left}th button{border:0;background:transparent;font-weight:700;cursor:pointer}.pager button{margin:12px 4px;padding:6px 10px}.active{background:#1769aa;color:#fff}</style></head>
<body><h1>Employee Data</h1><p id="table-summary">20 records</p><table id="user-table"><thead><tr><th><button id="sort-name">Name ↕</button></th><th><button id="sort-role">Role ↕</button></th><th>Country</th></tr></thead><tbody id="table-body"></tbody></table><div id="pagination" class="pager" aria-label="Pagination"></div>
<script>
const records=[["Ada Lovelace","Engineer","UK"],["Grace Hopper","Engineer","US"],["Linus Torvalds","Architect","Finland"],["Margaret Hamilton","Engineer","US"],["James Gosling","Architect","Canada"],["Guido van Rossum","Engineer","Netherlands"],["Radia Perlman","Engineer","US"],["Ken Thompson","Engineer","US"],["Barbara Liskov","Architect","US"],["Edsger Dijkstra","Engineer","Netherlands"],["Hedy Lamarr","Researcher","Austria"],["Dennis Ritchie","Engineer","US"],["Katherine Johnson","Researcher","US"],["Donald Knuth","Engineer","US"],["Annie Easley","Engineer","US"],["Tim Berners-Lee","Architect","UK"],["Karen Spärck Jones","Researcher","UK"],["Alan Kay","Engineer","US"],["Shafi Goldwasser","Researcher","Israel"],["Bjarne Stroustrup","Architect","Denmark"]];let page=1,sortKey=0,asc=true;
function render(){const data=[...records].sort((a,b)=>String(a[sortKey]).localeCompare(String(b[sortKey]))*(asc?1:-1));document.querySelector("#table-body").innerHTML=data.slice((page-1)*5,page*5).map((r,i)=>"<tr data-row='"+((page-1)*5+i+1)+"'><td>"+r[0]+"</td><td>"+r[1]+"</td><td>"+r[2]+"</td></tr>").join("");document.querySelector("#pagination").innerHTML=[1,2,3,4].map(n=>"<button data-page='"+n+"' class='"+(n===page?"active":"")+"'>"+n+"</button>").join("");document.querySelectorAll("[data-page]").forEach(b=>b.onclick=()=>{page=Number(b.dataset.page);render()})}
function sort(index){sortKey=index;asc=!asc;render()}document.querySelector("#sort-name").onclick=()=>sort(0);document.querySelector("#sort-role").onclick=()=>sort(1);render();
</script></body></html>
