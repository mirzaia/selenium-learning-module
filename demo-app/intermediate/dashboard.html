<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><title>Dashboard</title><style>body{font:16px system-ui;margin:40px}nav{padding:12px;background:#1f2937}nav a,nav button{color:white;margin-right:15px;background:transparent;border:0;font:inherit;cursor:pointer}.card{margin-top:22px;padding:20px;background:#f2f5f9;border-radius:8px}</style></head>
<body><nav id="navigation"><a id="dashboard-link" href="dashboard.html">Dashboard</a><a id="profile-link" href="#profile">Profile</a><button id="logout" type="button">Logout</button></nav><main class="card"><h1 id="welcome-message">Welcome, Learner!</h1><p id="dashboard-status">You are signed in to the learning dashboard.</p></main>
<script>const user=sessionStorage.getItem("demo-user");if(user)document.querySelector("#welcome-message").textContent="Welcome, "+user+"!";document.querySelector("#logout").onclick=()=>{sessionStorage.removeItem("demo-user");location.href="login.html"}</script>
</body></html>
